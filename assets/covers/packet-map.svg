<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Packet Orb 的俯视路线图">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6FE3D2" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3A45C"/>
      <stop offset=".5" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#6FE3D2"/>
    </linearGradient>
    <radialGradient id="node" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".4" stop-color="#8BFFF1"/>
      <stop offset="1" stop-color="#6FE3D2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#0B0A18"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <g opacity=".2">
    <rect x="80" y="600" width="320" height="180" fill="#3B2A56"/>
    <rect x="460" y="520" width="300" height="250" fill="#173B4D"/>
    <rect x="820" y="430" width="280" height="320" fill="#3E2648"/>
    <rect x="1150" y="300" width="330" height="380" fill="#243A3A"/>
  </g>
  <g fill="#6FE3D2" opacity=".55" font-family="Consolas, monospace" font-size="16" letter-spacing="3">
    <text x="80" y="120">PACKET ORB / TRACE MAP</text>
    <text x="80" y="150" fill="#A79F91" font-size="13">LATENCY = SLOPE · LOSS = CRATER · JITTER = TRAMPOLINE</text>
    <text x="1180" y="120" fill="#A79F91">SCHEMA packet-orb/1</text>
  </g>
  <path d="M220 760C330 700 380 740 470 670S620 560 760 600 890 500 1010 520 1140 410 1260 380 1390 300 1480 260"
        fill="none" stroke="#FF7A45" stroke-opacity=".18" stroke-width="28" stroke-linecap="round"/>
  <path d="M220 760C330 700 380 740 470 670S620 560 760 600 890 500 1010 520 1140 410 1260 380 1390 300 1480 260"
        fill="none" stroke="url(#route)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="#FF7A45" stroke-width="2" stroke-opacity=".65">
    <path d="M400 690L455 722 520 690 475 652Z"/>
    <path d="M1030 500L1085 532 1150 500 1105 462Z"/>
    <path d="M1200 390L1255 422 1320 390 1275 352Z"/>
  </g>
  <g font-family="Consolas, monospace" font-size="13" fill="#A79F91">
    <text x="410" y="740">DROP 4.2%</text>
    <text x="1040" y="550">JITTER</text>
    <text x="1210" y="440">ASN EDGE</text>
  </g>
  <g>
    <circle cx="220" cy="760" r="18" fill="#E3A45C" opacity=".2" filter="url(#glow)"/>
    <circle cx="220" cy="760" r="8" fill="#E3A45C"/><circle cx="220" cy="760" r="15" fill="none" stroke="#E3A45C" stroke-width="2"/>
    <circle cx="470" cy="670" r="7" fill="#FFB27A"/><circle cx="470" cy="670" r="14" fill="none" stroke="#FFB27A" stroke-width="1.5" opacity=".7"/>
    <circle cx="760" cy="600" r="7" fill="#FFD3A6"/><circle cx="760" cy="600" r="14" fill="none" stroke="#FFD3A6" stroke-width="1.5" opacity=".7"/>
    <circle cx="1010" cy="520" r="7" fill="#9FF7EE"/><circle cx="1010" cy="520" r="14" fill="none" stroke="#9FF7EE" stroke-width="1.5" opacity=".7"/>
    <circle cx="1260" cy="380" r="7" fill="#6FE3D2"/><circle cx="1260" cy="380" r="14" fill="none" stroke="#6FE3D2" stroke-width="1.5" opacity=".7"/>
    <circle cx="1480" cy="260" r="22" fill="url(#node)"/>
    <circle cx="1480" cy="260" r="9" fill="#F3FFFD"/>
  </g>
  <g font-family="Consolas, monospace" font-size="14" fill="#F1E6FF">
    <text x="190" y="800">01 / YOU</text><text x="438" y="710">02 / 12ms</text><text x="730" y="640">03 / 48ms</text>
    <text x="978" y="560">04 / 96ms</text><text x="1228" y="420">05 / 180ms</text><text x="1440" y="300">06 / TARGET</text>
  </g>
  <g stroke="#6FE3D2" stroke-opacity=".3" fill="none">
    <path d="M180 220H440V300H180Z"/><path d="M1260 700H1500V780H1260Z"/>
  </g>
  <g font-family="Consolas, monospace" font-size="13" fill="#6FE3D2" opacity=".7">
    <text x="196" y="254">FOG TUNNEL ×4</text>
    <text x="1276" y="734">SHARED VIA LZSS</text>
  </g>
</svg>
