<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="校园二手书平台的请求链路示意图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F22"/>
      <stop offset="1" stop-color="#171D42"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C7CFF" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#8FA0FF"/>
      <stop offset="1" stop-color="#6C7CFF" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#6C7CFF" stroke-opacity=".12" fill="none">
    <path d="M0 180H1600"/><path d="M0 450H1600"/><path d="M0 720H1600"/>
    <path d="M400 0V900"/><path d="M800 0V900"/><path d="M1200 0V900"/>
  </g>
  <text x="110" y="110" fill="#AEB8FF" font-family="Consolas, monospace" font-size="16" letter-spacing="3">CAMPUS BOOK MARKET / REQUEST PATH</text>
  <text x="110" y="150" fill="#6F7AA8" font-family="Consolas, monospace" font-size="12">0 frontend deps · 6 API routes · 4 tables</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(100 300)">
      <rect width="280" height="260" rx="14" fill="#111735" stroke="#6C7CFF" stroke-opacity=".45"/>
      <text x="24" y="42" fill="#6C7CFF" font-family="Consolas, monospace" font-size="12" letter-spacing="2">01 / BROWSER</text>
      <text x="24" y="86" fill="#FFFFFF" font-size="23" font-weight="700">原生页面</text>
      <text x="24" y="118" fill="#9DA9E6" font-size="13">HTML / CSS / JavaScript</text>
      <rect x="24" y="146" width="232" height="42" rx="7" fill="#1B2450"/>
      <text x="38" y="172" fill="#C9D2FF" font-family="Consolas, monospace" font-size="12">fetch('/api/books')</text>
      <text x="24" y="222" fill="#6F7AA8" font-size="12">无框架 · 无构建步骤</text>
    </g>
    <g transform="translate(470 300)">
      <rect width="280" height="260" rx="14" fill="#111735" stroke="#6C7CFF" stroke-opacity=".45"/>
      <text x="24" y="42" fill="#6C7CFF" font-family="Consolas, monospace" font-size="12" letter-spacing="2">02 / HTTP</text>
      <text x="24" y="86" fill="#FFFFFF" font-size="23" font-weight="700">Node 原生 http</text>
      <text x="24" y="118" fill="#9DA9E6" font-size="13">GET / POST / PATCH</text>
      <rect x="24" y="146" width="232" height="42" rx="7" fill="#1B2450"/>
      <text x="38" y="172" fill="#C9D2FF" font-family="Consolas, monospace" font-size="12">{ code, msg, data }</text>
      <text x="24" y="222" fill="#6F7AA8" font-size="12">PostgreSQL + pg</text>
    </g>
    <g transform="translate(840 300)">
      <rect width="280" height="260" rx="14" fill="#111735" stroke="#6FE3B0" stroke-opacity=".45"/>
      <text x="24" y="42" fill="#6FE3B0" font-family="Consolas, monospace" font-size="12" letter-spacing="2">03 / DATABASE</text>
      <text x="24" y="86" fill="#FFFFFF" font-size="23" font-weight="700">PostgreSQL</text>
      <text x="24" y="118" fill="#9DA9E6" font-size="13">4 张表 · 事务与约束</text>
      <g font-family="Consolas, monospace" font-size="12" fill="#C9D2FF">
        <rect x="24" y="146" width="232" height="14" rx="4" fill="#1B2450"/><text x="38" y="157">categories / owners</text>
        <rect x="24" y="168" width="232" height="14" rx="4" fill="#1B2450"/><text x="38" y="179">books / book_status_events</text>
      </g>
      <text x="24" y="222" fill="#6F7AA8" font-size="12">状态事件 · 触发器 · 视图</text>
    </g>
    <g transform="translate(1210 300)">
      <rect width="280" height="260" rx="14" fill="#111735" stroke="#E3A45C" stroke-opacity=".5"/>
      <text x="24" y="42" fill="#E3A45C" font-family="Consolas, monospace" font-size="12" letter-spacing="2">04 / FALLBACK</text>
      <text x="24" y="86" fill="#FFFFFF" font-size="23" font-weight="700">静态快照</text>
      <text x="24" y="118" fill="#9DA9E6" font-size="13">GitHub Pages · 只读</text>
      <rect x="24" y="146" width="232" height="42" rx="7" fill="#1B2450"/>
      <text x="38" y="172" fill="#FFD6A8" font-family="Consolas, monospace" font-size="12">books.json</text>
      <text x="24" y="222" fill="#6F7AA8" font-size="12">接口失败时自动降级</text>
    </g>
  </g>
  <g stroke="url(#line)" stroke-width="2" stroke-dasharray="6 8">
    <path d="M380 430H470"/><path d="M750 430H840"/><path d="M1120 430H1210"/>
  </g>
  <g fill="#8FA0FF">
    <path d="M466 430l-16 -8v16Z"/><path d="M836 430l-16 -8v16Z"/><path d="M1206 430l-16 -8v16Z"/>
  </g>
  <g transform="translate(100 650)">
    <rect width="1390" height="140" rx="14" fill="#0C1129" stroke="#6C7CFF" stroke-opacity=".22"/>
    <text x="28" y="40" fill="#6F7AA8" font-family="Consolas, monospace" font-size="12" letter-spacing="2">FALLBACK CONTRACT</text>
    <text x="28" y="82" fill="#C9D2FF" font-family="Consolas, monospace" font-size="17">try GET /api/books → catch → GET /data/books.json → render table</text>
    <text x="28" y="112" fill="#6F7AA8" font-family="Consolas, monospace" font-size="12">静态托管时仍可浏览；发布写入给出明确提示，而不是白屏。</text>
  </g>
</svg>
